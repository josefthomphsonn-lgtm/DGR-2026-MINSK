<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МотоКлуб — Участники</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5C518;
    --gold-dark: #d4a800;
    --black: #0a0a0a;
    --dark: #141414;
    --card: #1c1c1c;
    --card2: #242424;
    --text: #f0f0f0;
    --muted: #888;
    --border: #2e2e2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--black);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    padding-bottom: 80px;
  }

  /* SETUP SCREEN */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    gap: 20px;
  }
  .setup-logo { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--gold); letter-spacing: 4px; }
  .setup-sub { color: var(--muted); font-size: 13px; text-align: center; margin-top: -12px; }
  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; }
  .setup-card h3 { font-size: 14px; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .setup-input { width: 100%; background: var(--dark); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Montserrat', sans-serif; font-size: 13px; outline: none; margin-bottom: 10px; }
  .setup-input:focus { border-color: var(--gold); }
  .setup-btn { width: 100%; background: var(--gold); color: var(--black); border: none; border-radius: 10px; padding: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; cursor: pointer; transition: background .2s; }
  .setup-btn:hover { background: var(--gold-dark); }
  .setup-err { color: #ff5555; font-size: 12px; text-align: center; display: none; }

  /* APP */
  #app { display: none; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 3px; }
  .header-user { display: flex; align-items: center; gap: 8px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--black); cursor: pointer; }
  .login-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; padding: 6px 12px; font-family: 'Montserrat', sans-serif; font-size: 12px; cursor: pointer; font-weight: 600; }
  .search-bar { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; gap: 8px; }
  .search-bar input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Montserrat', sans-serif; font-size: 14px; }
  .search-bar input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 16px; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--dark); }
  .tab { flex: 1; padding: 12px 4px; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; text-transform: uppercase; letter-spacing: .5px; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* VIEWS */
  .view { display: none; padding: 16px; }
  .view.active { display: block; }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid var(--border);
  }
  .card:active { transform: scale(.97); }
  .card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--card2); display: flex; align-items: center; justify-content: center; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img-placeholder { color: var(--muted); font-size: 32px; }
  .card-body { padding: 10px; }
  .card-name { font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 3px; line-height: 1.2; }
  .card-bike { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .card-votes { display: flex; gap: 6px; margin-top: 6px; }
  .vote-badge { font-size: 10px; color: var(--gold); display: flex; align-items: center; gap: 3px; }

  /* TOP LIST */
  .top-list { display: flex; flex-direction: column; gap: 10px; }
  .top-item {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: transform .15s;
  }
  .top-item:active { transform: scale(.98); }
  .top-rank { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--border); min-width: 36px; text-align: center; }
  .top-rank.gold { color: #FFD700; }
  .top-rank.silver { color: #C0C0C0; }
  .top-rank.bronze { color: #CD7F32; }
  .top-img { width: 70px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--card2); flex-shrink: 0; }
  .top-img-placeholder { width: 70px; height: 56px; border-radius: 8px; background: var(--card2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; }
  .top-info { flex: 1; min-width: 0; }
  .top-name { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-bike-name { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .top-votes { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); min-width: 40px; text-align: right; }
  .top-votes span { display: block; font-family: 'Montserrat', sans-serif; font-size: 9px; color: var(--muted); text-align: right; font-weight: 600; }

  /* GALLERY */
  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .gallery-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; position: relative; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .gallery-item:hover img { transform: scale(1.05); }
  .gallery-item-placeholder { width: 100%; height: 100%; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 28px; }
  .gallery-name { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding: 20px 8px 6px; font-size: 11px; font-weight: 600; }

  /* DETAIL */
  #detail-view { display: none; position: fixed; inset: 0; background: var(--black); z-index: 200; overflow-y: auto; max-width: 480px; margin: 0 auto; padding-bottom: 40px; }
  .detail-back { position: sticky; top: 0; z-index: 10; background: rgba(10,10,10,.9); backdrop-filter: blur(8px); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .back-btn { background: none; border: none; color: var(--gold); font-size: 22px; cursor: pointer; padding: 0; line-height: 1; }
  .detail-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
  .detail-hero { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--card); }
  .detail-hero-placeholder { width: 100%; aspect-ratio: 16/9; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 48px; }
  .detail-content { padding: 16px; }
  .detail-name { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px; color: var(--gold); }
  .detail-bike { font-size: 15px; color: var(--muted); margin-bottom: 16px; }
  .detail-live-photo { width: 100%; border-radius: 12px; object-fit: cover; max-height: 240px; margin-bottom: 16px; }
  .detail-live-placeholder { width: 100%; height: 120px; border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; border: 1px dashed var(--border); }
  .detail-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--gold); color: var(--black); border: none; border-radius: 10px; padding: 13px; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; cursor: pointer; margin-bottom: 12px; text-decoration: none; }
  .detail-btn:hover { background: var(--gold-dark); }
  .detail-btn.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .specs { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .spec-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .spec-row:last-child { border-bottom: none; }
  .spec-label { font-size: 13px; color: var(--muted); }
  .spec-value { font-size: 13px; font-weight: 600; }

  /* VOTE SECTION */
  .vote-section { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .vote-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  .vote-btns { display: flex; gap: 10px; }
  .vote-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 6px; cursor: pointer; transition: all .2s; color: var(--text);
    font-family: 'Montserrat', sans-serif;
  }
  .vote-btn.voted { background: rgba(245,197,24,.15); border-color: var(--gold); }
  .vote-btn:disabled { opacity: .5; cursor: default; }
  .vote-btn-icon { font-size: 20px; }
  .vote-btn-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .vote-btn-count { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold); }

  /* LOGIN MODAL */
  #login-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
    z-index: 300; align-items: flex-end; justify-content: center;
    max-width: 480px; margin: 0 auto;
  }
  #login-modal.open { display: flex; }
  .login-sheet { background: var(--dark); border-radius: 20px 20px 0 0; padding: 28px 24px 40px; width: 100%; border-top: 1px solid var(--border); }
  .login-sheet h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
  .login-sheet p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .login-field { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none; margin-bottom: 10px; }
  .login-field:focus { border-color: var(--gold); }
  .login-submit { width: 100%; background: var(--gold); color: var(--black); border: none; border-radius: 10px; padding: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; cursor: pointer; margin-bottom: 10px; }
  .login-cancel { width: 100%; background: transparent; color: var(--muted); border: none; padding: 10px; font-family: 'Montserrat', sans-serif; font-size: 13px; cursor: pointer; }
  .login-err { color: #ff5555; font-size: 12px; margin-bottom: 8px; display: none; }

  /* NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: rgba(20,20,20,.97); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: none; grid-template-columns: repeat(4, 1fr);
    z-index: 100;
  }
  .bottom-nav.visible { display: grid; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; cursor: pointer; color: var(--muted); transition: color .2s; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .nav-item.active { color: var(--gold); }
  .nav-icon { font-size: 20px; }

  /* LOADING */
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--muted); gap: 10px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-logo">🏍 МОТО<br>КЛУБ</div>
  <div class="setup-sub">Введите данные для подключения к базе</div>
  <div class="setup-card">
    <h3>Настройка подключения</h3>
    <input class="setup-input" id="inp-token" placeholder="Personal Access Token (pat...)" value="">
    <input class="setup-input" id="inp-base" placeholder="Base ID (app...)" value="">
    <input class="setup-input" id="inp-table" placeholder="Название таблицы" value="дгр">
    <div class="setup-err" id="setup-err">Ошибка подключения. Проверьте данные.</div>
    <button class="setup-btn" onclick="connectAirtable()">ПОДКЛЮЧИТЬ</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div class="header-title" id="header-title">УЧАСТНИКИ</div>
      <div class="header-user">
        <div id="user-display"></div>
      </div>
    </div>
    <div class="search-bar" id="search-wrap" style="display:none">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Поиск..." id="search-input" oninput="filterCards()">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)" id="tab0">👥 Участники</div>
    <div class="tab" onclick="switchTab(1)" id="tab1">🏆 ТОП Байк</div>
    <div class="tab" onclick="switchTab(2)" id="tab2">✨ ТОП Стиль</div>
    <div class="tab" onclick="switchTab(3)" id="tab3">🖼 Галерея</div>
  </div>

  <div class="view active" id="view0">
    <div id="members-grid" class="grid"></div>
  </div>
  <div class="view" id="view1">
    <div id="top-bike-list" class="top-list"></div>
  </div>
  <div class="view" id="view2">
    <div id="top-style-list" class="top-list"></div>
  </div>
  <div class="view" id="view3">
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>
</div>

<!-- DETAIL -->
<div id="detail-view">
  <div class="detail-back">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="detail-title" id="detail-header-title">Участник</div>
  </div>
  <div id="detail-content"></div>
</div>

<!-- LOGIN MODAL -->
<div id="login-modal">
  <div class="login-sheet">
    <h2>Войти</h2>
    <p>Для голосования нужно авторизоваться</p>
    <input class="login-field" id="login-name" placeholder="Ваше имя (как в списке участников)">
    <div class="login-err" id="login-err">Имя не найдено в списке участников</div>
    <button class="login-submit" onclick="doLogin()">ВОЙТИ</button>
    <button class="login-cancel" onclick="closeLogin()">Отмена</button>
  </div>
</div>

<script>
let TOKEN = '', BASE_ID = '', TABLE = '';
let allRecords = [];
let currentUser = null; // { name, recordId }
let currentRecord = null;
let votedBike = new Set();
let votedStyle = new Set();

// ── SETUP ──
function connectAirtable() {
  TOKEN = document.getElementById('inp-token').value.trim();
  BASE_ID = document.getElementById('inp-base').value.trim();
  TABLE = document.getElementById('inp-table').value.trim() || 'дгр';
  if (!TOKEN || !BASE_ID) return;
  fetchRecords().then(ok => {
    if (ok) {
      localStorage.setItem('mc_config', JSON.stringify({ token: TOKEN, base: BASE_ID, table: TABLE }));
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('bottom-nav').classList.add('visible');
      document.getElementById('search-wrap').style.display = 'flex';
      updateUserDisplay();
      renderAll();
    } else {
      document.getElementById('setup-err').style.display = 'block';
    }
  });
}

async function fetchRecords() {
  try {
    let records = [], offset = null;
    do {
      const url = `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE)}?pageSize=100${offset ? '&offset=' + offset : ''}`;
      const r = await fetch(url, { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (!r.ok) return false;

      const d = await r.json();
      records = records.concat(d.records);
      offset = d.offset;
    } while (offset);
    allRecords = records;
    // load votes from localStorage
    const saved = JSON.parse(localStorage.getItem('mc_votes') || '{}');
    votedBike = new Set(saved.bike || []);
    votedStyle = new Set(saved.style || []);
    const savedUser = localStorage.getItem('mc_user');
    if (savedUser) currentUser = JSON.parse(savedUser);
    return true;
  } catch { return false; }
}

async function patchRecord(id, fields) {
  await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(TABLE)}/${id}`, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
}

// ── RENDER ──
function renderAll() {
  renderMembers();
  renderTopBike();
  renderTopStyle();
  renderGallery();
}

function getImg(r) {
  return r.fields['Attachment_Photo'] || r.fields['factory_photo'] || '';
}
function getLiveImg(r) {
  return r.fields['live_photo'] || r.fields['Live_photo'] || '';
}

function renderMembers() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase();
  const data = allRecords.filter(r => {
    const n = (r.fields.name || '').toLowerCase();
    const b = (r.fields.bike || '').toLowerCase();
    return !q || n.includes(q) || b.includes(q);
  });
  const g = document.getElementById('members-grid');
  if (!data.length) { g.innerHTML = '<div class="empty" style="grid-column:span 2">Участники не найдены</div>'; return; }
  g.innerHTML = data.map(r => {
    const img = getImg(r);
    const imgHtml = img
      ? `<img src="${img}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"><div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;color:var(--muted);font-size:32px">🏍</div>`
      : `<div style="font-size:32px;color:var(--muted)">🏍</div>`;
    const bv = r.fields.votes_bike || 0;
    const sv = r.fields.votes_style || 0;
    return `<div class="card" onclick="openDetail('${r.id}')">
      <div class="card-img">${imgHtml}</div>
      <div class="card-body">
        <div class="card-name">${r.fields.name || '—'}</div>
        <div class="card-bike">${r.fields.bike || 'не указан'}</div>
        <div class="card-votes">
          ${bv ? `<span class="vote-badge">🏆 ${bv}</span>` : ''}
          ${sv ? `<span class="vote-badge">✨ ${sv}</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterCards() { renderMembers(); }

function renderTopBike() {
  const sorted = [...allRecords].sort((a,b) => (b.fields.votes_bike||0) - (a.fields.votes_bike||0));
  renderTopList('top-bike-list', sorted, 'votes_bike', '🏆 голосов за байк');
}

function renderTopStyle() {
  const sorted = [...allRecords].sort((a,b) => (b.fields.votes_style||0) - (a.fields.votes_style||0));
  renderTopList('top-style-list', sorted, 'votes_style', '✨ голосов за стиль');
}

function renderTopList(elId, data, field, label) {
  const el = document.getElementById(elId);
  const ranks = ['gold','silver','bronze'];
  el.innerHTML = data.map((r, i) => {
    const img = getImg(r);
    const imgHtml = img
      ? `<img class="top-img" src="${img}" onerror="this.style.display='none'" loading="lazy">`
      : `<div class="top-img-placeholder">🏍</div>`;
    const rankClass = i < 3 ? ranks[i] : '';
    const votes = r.fields[field] || 0;
    return `<div class="top-item" onclick="openDetail('${r.id}')">
      <div class="top-rank ${rankClass}">${i+1}</div>
      ${imgHtml}
      <div class="top-info">
        <div class="top-name">${r.fields.name || '—'}</div>
        <div class="top-bike-name">${r.fields.bike || 'не указан'}</div>
      </div>
      <div class="top-votes">${votes}<span>${label}</span></div>
    </div>`;
  }).join('');
}

function renderGallery() {
  const withPhoto = allRecords.filter(r => getLiveImg(r) || getImg(r));
  const g = document.getElementById('gallery-grid');
  if (!withPhoto.length) { g.innerHTML = '<div class="empty" style="grid-column:span 2">Фото пока нет</div>'; return; }
  g.innerHTML = withPhoto.map(r => {
    const img = getLiveImg(r) || getImg(r);
    return `<div class="gallery-item" onclick="openDetail('${r.id}')">
      <img src="${img}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=gallery-item-placeholder>🏍</div>'">
      <div class="gallery-name">${r.fields.name || ''}</div>
    </div>`;
  }).join('');
}

// ── DETAIL ──
function openDetail(id) {
  const r = allRecords.find(x => x.id === id);
  if (!r) return;
  currentRecord = r;
  const f = r.fields;
  document.getElementById('detail-header-title').textContent = f.name || 'Участник';

  const factoryImg = getImg(r);
  const liveImg = getLiveImg(r);
  const heroHtml = factoryImg
    ? `<img class="detail-hero" src="${factoryImg}" onerror="this.outerHTML='<div class=detail-hero-placeholder>🏍</div>'">`
    : `<div class="detail-hero-placeholder">🏍</div>`;

  const liveHtml = liveImg
    ? `<img class="detail-live-photo" src="${liveImg}" onerror="this.style.display='none'">`
    : `<div class="detail-live-placeholder">📷 Живое фото не загружено</div>`;

  const specs = [
    ['Объём, см³', f.m3 || f['m3']],
    ['Мощность, л.с.', f.power_h || f['power_h']],
    ['Момент, Н·м', f['moment_N*m'] || f['moment_Nm']],
    ['Масса, кг', f.massa_kg],
    ['Высота по седлу', f.Heiht || f.heiht],
    ['Тип привода', f.privod],
  ].filter(([,v]) => v !== undefined && v !== null && v !== '');

  const specsHtml = specs.length ? `<div class="specs">
    ${specs.map(([l,v]) => `<div class="spec-row"><span class="spec-label">${l}</span><span class="spec-value">${v}</span></div>`).join('')}
  </div>` : '';

  const infoUrl = f.factory_information || f['factory_information'];
  const infoBtnHtml = infoUrl ? `<a class="detail-btn" href="${infoUrl}" target="_blank">🔗 Подробнее о модели</a>` : '';

  // votes
  const bv = f.votes_bike || 0;
  const sv = f.votes_style || 0;
  const canVote = !!currentUser && currentUser.recordId !== id;
  const votedB = votedBike.has(id);
  const votedS = votedStyle.has(id);

  const voteSectionHtml = `<div class="vote-section">
    <div class="vote-title">Голосование</div>
    <div class="vote-btns">
      <button class="vote-btn ${votedB?'voted':''}" ${!canVote?'disabled':''} onclick="vote('${id}','bike')" id="vbtn-bike">
        <span class="vote-btn-icon">🏆</span>
        <span class="vote-btn-count" id="vcount-bike">${bv}</span>
        <span class="vote-btn-label">ТОП Байк</span>
      </button>
      <button class="vote-btn ${votedS?'voted':''}" ${!canVote?'disabled':''} onclick="vote('${id}','style')" id="vbtn-style">
        <span class="vote-btn-icon">✨</span>
        <span class="vote-btn-count" id="vcount-style">${sv}</span>
        <span class="vote-btn-label">ТОП Стиль</span>
      </button>
    </div>
    ${!currentUser ? `<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">
      <span style="color:var(--gold);cursor:pointer;font-weight:600" onclick="openLogin()">Войдите</span>, чтобы голосовать
    </p>` : ''}
    ${currentUser && currentUser.recordId === id ? `<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px">Это ваша карточка</p>` : ''}
  </div>`;

  document.getElementById('detail-content').innerHTML = `
    ${heroHtml}
    <div class="detail-content">
      <div class="detail-name">${f.name || '—'}</div>
      <div class="detail-bike">${f.bike || 'Мотоцикл не указан'}</div>
      ${liveHtml}
      ${voteSectionHtml}
      ${infoBtnHtml}
      ${specsHtml}
    </div>`;

  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('detail-view').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  renderAll();
}

// ── VOTE ──
async function vote(recordId, type) {
  if (!currentUser) { openLogin(); return; }
  const r = allRecords.find(x => x.id === recordId);
  if (!r) return;
  const field = type === 'bike' ? 'votes_bike' : 'votes_style';
  const voted = type === 'bike' ? votedBike : votedStyle;
  if (voted.has(recordId)) return;
  voted.add(recordId);
  r.fields[field] = (r.fields[field] || 0) + 1;
  // save votes
  const saved = { bike: [...votedBike], style: [...votedStyle] };
  localStorage.setItem('mc_votes', JSON.stringify(saved));
  // update UI
  document.getElementById(`vcount-${type}`).textContent = r.fields[field];
  document.getElementById(`vbtn-${type}`).classList.add('voted');
  document.getElementById(`vbtn-${type}`).disabled = true;
  // patch airtable
  await patchRecord(recordId, { [field]: r.fields[field] });
}

// ── AUTH ──
function openLogin() { document.getElementById('login-modal').classList.add('open'); }
function closeLogin() { document.getElementById('login-modal').classList.remove('open'); }

function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  const found = allRecords.find(r => (r.fields.name || '').toLowerCase() === name.toLowerCase());
  if (!found) {
    document.getElementById('login-err').style.display = 'block';
    return;
  }
  currentUser = { name: found.fields.name, recordId: found.id };
  localStorage.setItem('mc_user', JSON.stringify(currentUser));
  closeLogin();
  updateUserDisplay();
  if (currentRecord) openDetail(currentRecord.id);
}

function updateUserDisplay() {
  const el = document.getElementById('user-display');
  if (currentUser) {
    const initials = currentUser.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
    el.innerHTML = `<div class="user-avatar" title="${currentUser.name}" onclick="logoutUser()">${initials}</div>`;
  } else {
    el.innerHTML = `<button class="login-btn" onclick="openLogin()">Войти</button>`;
  }
}

function logoutUser() {
  if (confirm('Выйти из аккаунта?')) {
    currentUser = null;
    localStorage.removeItem('mc_user');
    updateUserDisplay();
  }
}

// ── TABS ──
function switchTab(i) {
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', i===j));
  document.querySelectorAll('.view').forEach((v,j) => v.classList.toggle('active', i===j));
  const titles = ['УЧАСТНИКИ','ТОП БАЙК','ТОП СТИЛЬ','ГАЛЕРЕЯ'];
  document.getElementById('header-title').textContent = titles[i];
  document.getElementById('search-wrap').style.display = i===0 ? 'flex' : 'none';
  // update nav
  document.querySelectorAll('.nav-item').forEach((n,j) => n.classList.toggle('active', i===j));
}

// Auto-connect from localStorage if previously saved
window.onload = () => {
  const saved = JSON.parse(localStorage.getItem('mc_config') || '{}');
  if (saved.token && saved.base && saved.table) {
    TOKEN = saved.token;
    BASE_ID = saved.base;
    TABLE = saved.table;
    fetchRecords().then(ok => {
      if (ok) {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('bottom-nav').classList.add('visible');
        document.getElementById('search-wrap').style.display = 'flex';
        updateUserDisplay();
        renderAll();
      } else {
        localStorage.removeItem('mc_config');
      }
    });
  }
};
</script>

<!-- BOTTOM NAV -->
<nav class="bottom-nav" id="bottom-nav">
  <div class="nav-item active" onclick="switchTab(0)"><span class="nav-icon">👥</span>Участники</div>
  <div class="nav-item" onclick="switchTab(1)"><span class="nav-icon">🏆</span>ТОП Байк</div>
  <div class="nav-item" onclick="switchTab(2)"><span class="nav-icon">✨</span>ТОП Стиль</div>
  <div class="nav-item" onclick="switchTab(3)"><span class="nav-icon">🖼</span>Галерея</div>
</nav>
